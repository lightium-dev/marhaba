version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: marhba-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marhaba
    ports:
      - "5432:5432"
    volumes:
      - marhba_pgdata:/var/lib/postgresql/data

volumes:
  marhba_pgdata:
